name: push validation

on:
  push:
    branches:
      - '**'

permissions:
  contents: read
  # Allows the workflow to:
  # Upload SARIF security analysis reports.
  # Publish code scanning findings to GitHub.
  # Display detected security vulnerabilities in the repository's Security → Code scanning section.
  security-events: write

jobs:
  validate_after_pushed:
    name: on push build the project
    runs-on: ubuntu-latest
    steps:
      - name: fetch the repo contents
        uses: actions/checkout@v4

      - name: setup java 21
        # pre-defined
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: check if maven exists
        run: |
          if command -v mvn &> /dev/null; then 
            echo "Maven is already installed"
          else 
            echo "Maven is not found. installing..."
            sudo apt-get update
            sudo apt-get install -y maven
          fi
          mvn --version

      - name: compile and build
        run: mvn -B -ntp clean compile

      - name: Run unit testing
        run: mvn -B -ntp test

      # Linting is done for source code across various programming languages to automatically detect programmatic errors, bugs,
      # and stylistic inconsistencies before code runs or reaches production
      - name: Run linting - check coding style issues
        run: mvn -B -ntp checkstyle:check

      # prepares the CodeQL environment and tools so your repository can be scanned for security vulnerabilities and coding errors
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: autobuild
          # build-mode: manual has nothing to do with manually triggering GitHub Actions.
          #It refers specifically to how CodeQL builds your application.
          #CodeQL supports different build modes:
          #autobuild : CodeQL attempts to automatically build your project.
          #manual : You explicitly provide the build command.
          #none : CodeQL uses a build-less analysis approach where supported.

      # Why the Second Build is Required
      # CodeQL Tracer Requirement: When Initialize CodeQL runs, it injects a background build tracer into the runner environment. This tracer watches the Java compiler (javac) execute and records how every class, method, and dependency connects.
      # Why the First Build Doesn't Count: Your first mvn clean compile ran before CodeQL was initialized, so CodeQL did not observe it and has no record of your code structure.
      # Why clean is Mandatory: If you ran mvn compile without clean, Maven would see that the .class files already exist from the first step, skip compilation (Nothing to compile - all classes are up to date), and leave CodeQL with an empty database—causing the analysis step to fail.

# we are trying if autobuild works and solves the CodeQL issue
#      - name: Build for CodeQL
#        run: mvn -B -ntp clean compile -DskipTests

        #What it does
        #echo -  Prints a message in GitHub Actions logs.
        #find target/classes -type f : - Finds all files inside the compiled classes directory.
        #For example, it might display:
        #target/classes/org/rspk/auth/AuthServiceApplication.class
        #target/classes/org/rspk/auth/controller/AuthController.class
        #target/classes/org/rspk/auth/service/AuthService.class
        #This confirms that Maven generated compiled class files.
      - name: Verify compilation
        run: |
          echo "Checking compiled classes..."
          find target/classes -type f | head -20

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      # It scans dependencies in your pom.xml and identifies known vulnerabilities.
      #For example:
      #Vulnerable Spring dependencies.
      #Outdated libraries with known CVEs.
      #Vulnerable third-party Maven packages.
      - name: Dependency vulnerability scanning
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7
          
          

